# ============================================================
# mongo-ycsb — Zepto Configuration
# Replicates the exact YCSB parameters Zepto used for their
# v7 vs v8 benchmark (Round 3 methodology).
#
# Load:  ./bin/ycsb.sh load mongodb -P workloads/workloadb
#        -threads 512 -p recordcount=2000000
#        -p fieldcount=20 -p fieldlength=1000
#        -p maxPoolSize=1000
#
# Run:   ./bin/ycsb.sh run mongodb -P workloads/workloada
#        -threads 512 -p recordcount=2000000
#        -p operationcount=10000000
#        -p fieldcount=20 -p fieldlength=1000
# ============================================================

connection:
  uri: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/"
  database: "ycsb1"
  collection: "usertable"
  readPreference: "primary"
  readConcern: "local"
  writeConcern: "majority"     # Zepto used w=majority, journal=true
  connectionPoolSize: 1000      # matches -p maxPoolSize=1000
  timeoutMs: 60000

workload:
  type: "A"                    # 50% read, 50% update
  writeAllFields: false        # YCSB default — update 1 field per op
  readAllFields: true          # YCSB default — read full document
  scan:
    minLength: 1
    maxLength: 1000
    distribution: "uniform"

documentShape:
  fieldCount: 20               # matches -p fieldcount=20
  fieldSize: 1000              # matches -p fieldlength=1000 → ~20KB documents
  nestedDocs: false
  arrays: false
  useRealisticData: false      # YCSB uses random bytes — set false to match

indexes: []                    # YCSB does not create indexes by default

execution:
  mode: "ops"
  operationCount: 10000000     # matches -p operationcount=10000000
  threads: 512                 # matches -threads 512
  targetOpsPerSec: 0           # unlimited — let the cluster determine throughput

  # Key space — CRITICAL for fair comparison
  keyDistribution: "zipfian"   # YCSB default — must match for comparable results
  zipfianConstant: 0.99        # YCSB default
  recordCount: 2000000         # matches -p recordcount=2000000
  keyPrefix: "user"
  keyZeroPadding: 0            # YCSB default (no padding in modern versions)
  insertOrdering: "ordered"

  rampup:
    initialThreads: 1
    maxThreads: 512
    stepSize: 64
    stepDuration: "60s"

phases:
  preload:
    enabled: true
    skipIfExists: false
    documentCount: 2000000     # matches -p recordcount=2000000
    threads: 512               # use full thread count for fast load
  warmup:
    enabled: true
    duration: "5m"             # warm WiredTiger cache before measurement

schedule:
  enabled: false
  cron: ""
  startAt: ""
  stopAt: ""
  runFor: ""
  maxRuns: 0

results:
  mongodb:
    enabled: true
    uri: "mongodb+srv://<results-cluster>/ycsb_results"
    database: "ycsb_results"
    collection: "zepto_runs"
  local:
    enabled: true
    path: "./results/zepto"
  tags:
    - "zepto"
    - "v7"         # change to "v8" when running against v8 cluster
    - "workload-a"
    - "zipfian"
    - "m40"

reporting:
  console:
    enabled: true
    refreshIntervalMs: 5000   # 5s intervals like Zepto used
  html:
    enabled: true
    outputPath: "./reports/zepto"
  csv:
    enabled: true
    outputPath: "./results/zepto"