# ============================================================
# mongo-ycsb — Example Configuration
# ============================================================

connection:
  uri: "mongodb+srv://mongoadmin:passwordone@consultnew.3eano.mongodb.net/"
  database: "ycsb"
  collection: "usertable"
  readPreference: "primary"
  readConcern: "local"
  writeConcern: "majority"
  connectionPoolSize: 100
  timeoutMs: 30000

workload:
  type: "A"
  custom:
    read: 50
    insert: 0
    update: 50
    delete: 0
    scan: 0
    readModifyWrite: 0

documentShape:
  fieldCount: 10
  fieldSize: 100
  nestedDocs: false
  nestedDepth: 2
  arrays: false
  arraySize: 5
  useRealisticData: true

# Single field indexes
indexes:
  - field: "field0"
    type: "asc"
    sparse: false
    unique: false

# Compound index example (uncomment to use):
# indexes:
#   - fields:
#       - field: "field0"
#         type: "asc"
#       - field: "field1"
#         type: "desc"
#     sparse: false
#     unique: false

execution:
  mode: "time"
  duration: "5m"
  operationCount: 1000000
  threads: 10
  targetOpsPerSec: 0
  rampup:
    initialThreads: 1
    maxThreads: 100
    stepSize: 10
    stepDuration: "30s"

phases:
  preload:
    enabled: true
    skipIfExists: false      # set true to skip preload if collection has data
    documentCount: 100000
    threads: 20
  warmup:
    enabled: true
    duration: "30s"

schedule:
  enabled: false
  cron: "0 2 * * *"
  # Bounding — all optional, first limit hit wins:
  startAt: ""               # e.g. "2026-05-01T00:00:00Z"
  stopAt:  ""               # e.g. "2026-05-07T23:59:59Z"
  runFor:  ""               # e.g. "600s" or "2h"
  maxRuns: 0                # 0 = unlimited

results:
  mongodb:
    enabled: true
    uri: "mongodb+srv://mongoadmin:passwordone@consultnew.3eano.mongodb.net/"
    database: "ycsb_results"
    collection: "runs"
  local:
    enabled: true
    path: "./results"
  tags:
    - "baseline"

reporting:
  console:
    enabled: true
    refreshIntervalMs: 1000
  html:
    enabled: true
    outputPath: "./reports"
  csv:
    enabled: true
    outputPath: "./results"