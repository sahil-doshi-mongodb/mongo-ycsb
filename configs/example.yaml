# ============================================================
# mongo-ycsb — Example Configuration
# ============================================================

connection:
  uri: "mongodb+srv://mongoadmin:OI4rBsvCtfUekLKg@consultnew.3eano.mongodb.net/"
  database: "ycsb"
  collection: "usertable"
  readPreference: "primary"
  readConcern: "local"
  writeConcern: "majority"
  connectionPoolSize: 100
  timeoutMs: 30000

workload:
  type: "A"
  # writeAllFields: false   # false = update 1 field (YCSB default)
  # readAllFields: true     # true = read full document (YCSB default)
  custom:
    read: 50
    insert: 0
    update: 50
    delete: 0
    scan: 0
    readModifyWrite: 0
  scan:
    minLength: 1            # YCSB default
    maxLength: 1000         # YCSB default; Workload E uses 100
    distribution: "uniform"

documentShape:
  fieldCount: 10
  fieldSize: 100            # exact bytes per field — set to 1000 to match Zepto
  nestedDocs: false
  nestedDepth: 2
  arrays: false
  arraySize: 5
  useRealisticData: false   # false = random bytes (YCSB default)

indexes:
  - field: "field0"
    type: "asc"
    sparse: false
    unique: false

execution:
  mode: "time"
  duration: "5m"
  operationCount: 1000000
  threads: 10
  targetOpsPerSec: 0        # 0 = unlimited

  # Key space & distribution
  keyDistribution: "uniform"  # uniform | zipfian | latest | sequential
  zipfianConstant: 0.99       # YCSB default
  recordCount: 0              # 0 = use preload document count
  keyPrefix: "user"           # YCSB default
  keyZeroPadding: 0           # 0 = no padding; set e.g. 12 to match YCSB exactly
  insertOrdering: "ordered"   # ordered | hashed (hashed avoids shard hotspots)

  rampup:
    initialThreads: 1
    maxThreads: 100
    stepSize: 10
    stepDuration: "30s"

phases:
  preload:
    enabled: true
    skipIfExists: false
    documentCount: 100000
    threads: 20
  warmup:
    enabled: true
    duration: "30s"

schedule:
  enabled: false

  # Standard 5-field cron expression — when to trigger each run.
  # Examples:
  #   "* * * * *"       every minute
  #   "*/30 * * * *"    every 30 minutes
  #   "0 2 * * *"       every day at 02:00
  #   "0 */6 * * *"     every 6 hours
  cron: "0 2 * * *"

  # Bounds — controls when the scheduler STOPS.
  # Set bounds.type to exactly ONE of: unlimited | runFor | maxRuns | timeWindow
  # Only populate the fields for the type you choose — leave all others empty/zero.
  bounds:
    # unlimited  → runs forever until you press Ctrl+C
    # runFor     → stops after a total wall-clock duration from start
    # maxRuns    → stops after N completed runs
    # timeWindow → only fires between startAt and stopAt
    type: "unlimited"

    # Used when type: runFor
    # How long to keep firing triggers from the moment the scheduler starts.
    # e.g. "600s" fires every cron tick for 10 minutes total.
    runFor: ""

    # Used when type: maxRuns
    # Stop after exactly this many successfully completed runs.
    maxRuns: 0

    # Used when type: timeWindow
    # Both are required. Triggers before startAt are skipped.
    # Scheduler shuts down when a trigger fires after stopAt.
    startAt: ""   # RFC3339 e.g. "2026-05-01T00:00:00Z"
    stopAt:  ""   # RFC3339 e.g. "2026-05-07T23:59:59Z"

results:
  mongodb:
    enabled: true
    uri: "mongodb+srv://mongoadmin:OI4rBsvCtfUekLKg@consultnew.3eano.mongodb.net/"
    database: "ycsb_results"
    collection: "runs"
  local:
    enabled: true
    path: "./results"
  tags:
    - "baseline"

reporting:
  console:
    enabled: true
    refreshIntervalMs: 1000
  html:
    enabled: true
    outputPath: "./reports"
  csv:
    enabled: true
    outputPath: "./results"