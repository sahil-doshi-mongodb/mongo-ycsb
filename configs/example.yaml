# ============================================================
# mongo-ycsb — Example Configuration
# ============================================================

connection:
  uri: "mongodb://localhost:27017"
  database: "ycsb"
  collection: "usertable"
  readPreference: "primary"
  readConcern: "local"
  writeConcern: "majority"
  connectionPoolSize: 100
  timeoutMs: 30000

workload:
  type: "A"
  # writeAllFields: false   # false = update 1 field (YCSB default)
  # readAllFields: true     # true = read full document (YCSB default)
  custom:
    read: 50
    insert: 0
    update: 50
    delete: 0
    scan: 0
    readModifyWrite: 0
  scan:
    minLength: 1            # YCSB default
    maxLength: 1000         # YCSB default; Workload E uses 100
    distribution: "uniform"

documentShape:
  fieldCount: 10
  fieldSize: 100            # exact bytes per field — set to 1000 to match Zepto
  nestedDocs: false
  nestedDepth: 2
  arrays: false
  arraySize: 5
  useRealisticData: false   # false = random bytes (YCSB default)

indexes:
  - field: "field0"
    type: "asc"
    sparse: false
    unique: false

execution:
  mode: "time"
  duration: "5m"
  operationCount: 1000000
  threads: 10
  targetOpsPerSec: 0        # 0 = unlimited

  # Key space & distribution
  keyDistribution: "uniform"  # uniform | zipfian | latest | sequential
  zipfianConstant: 0.99       # YCSB default
  recordCount: 0              # 0 = use preload document count
  keyPrefix: "user"           # YCSB default
  keyZeroPadding: 0           # 0 = no padding; set e.g. 12 to match YCSB exactly
  insertOrdering: "ordered"   # ordered | hashed (hashed avoids shard hotspots)

  rampup:
    initialThreads: 1
    maxThreads: 100
    stepSize: 10
    stepDuration: "30s"

phases:
  preload:
    enabled: true
    skipIfExists: false
    documentCount: 100000
    threads: 20
  warmup:
    enabled: true
    duration: "30s"

schedule:
  enabled: false
  cron: "0 2 * * *"
  startAt: ""
  stopAt: ""
  runFor: ""
  maxRuns: 0

results:
  mongodb:
    enabled: true
    uri: "mongodb://localhost:27017"
    database: "ycsb_results"
    collection: "runs"
  local:
    enabled: true
    path: "./results"
  tags:
    - "baseline"

reporting:
  console:
    enabled: true
    refreshIntervalMs: 1000
  html:
    enabled: true
    outputPath: "./reports"
  csv:
    enabled: true
    outputPath: "./results"