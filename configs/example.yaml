

# ============================================================
# mongo-ycsb — Example Configuration File
# ============================================================
# This file controls every aspect of a benchmark run.
# CLI flags override any value set here.
# Environment variables prefixed with MONGOYCSB_ also override
# config values (e.g. MONGOYCSB_CONNECTION_URI).
#
# Run validation without executing:
#   go run main.go dry-run --config configs/example.yaml
#
# Run the benchmark:
#   go run main.go run --config configs/example.yaml
#
# Override specific values at runtime:
#   go run main.go run --config configs/example.yaml \
#     --threads 100 --duration 2m --workload B
# ============================================================


# ─────────────────────────────────────────────────────────────
# CONNECTION
# Controls how mongo-ycsb connects to your MongoDB cluster.
# ─────────────────────────────────────────────────────────────
connection:

  # MongoDB connection string.
  # Self-managed:  "mongodb://localhost:27017"
  # Atlas replica: "mongodb+srv://user:password@cluster.mongodb.net/"
  # With options:  "mongodb://host:27017/?replicaSet=rs0&authSource=admin"
  # REQUIRED — the benchmark will not start without this.
  uri: "mongodb+srv://user:password@cluster.mongodb.net/"

  # Database to benchmark against.
  # Will be created automatically if it does not exist.
  database: "ycsb"

  # Collection to benchmark against.
  # Dropped and recreated during preload unless skipIfExists is true.
  collection: "usertable"

  # Read preference — controls which replica set members handle reads.
  #   primary            → all reads go to the primary (default)
  #   primaryPreferred   → reads go to primary; falls back to secondary
  #   secondary          → reads go to a secondary only
  #   secondaryPreferred → reads go to a secondary; falls back to primary
  #   nearest            → reads go to the member with lowest network latency
  # For benchmarking write-heavy workloads, use "primary".
  # For read-scaling tests, use "secondaryPreferred" or "nearest".
  readPreference: "primary"

  # Read concern — controls the consistency level for reads.
  #   local         → returns data from the local node (default, fastest)
  #   majority      → returns data acknowledged by a majority of nodes
  #   linearizable  → strongest guarantee; highest latency
  #   available     → no guarantee; fastest but may return stale data
  readConcern: "local"

  # Write concern — controls how many nodes must acknowledge a write.
  #   majority → waits for a majority of replica set members (safest)
  #   w:1      → waits for the primary only (faster, less durable)
  #   w:0      → fire and forget — no acknowledgement (fastest, unsafe)
  # Note: "majority" adds significant write latency vs "w:1" on Atlas.
  # This is one of the most impactful settings for write benchmarks.
  writeConcern: "majority"

  # Maximum number of connections in the connection pool.
  # Should be >= threads to avoid connection contention.
  # Atlas M10:  max ~500 connections
  # Atlas M40:  max ~2000 connections
  # Atlas M80+: max ~4000 connections
  connectionPoolSize: 100

  # Server selection timeout in milliseconds.
  # If mongo-ycsb cannot find a suitable server within this time, it fails.
  # Increase for slow networks or large clusters.
  timeoutMs: 30000


# ─────────────────────────────────────────────────────────────
# WORKLOAD
# Controls the mix of operations sent to MongoDB.
# ─────────────────────────────────────────────────────────────
workload:

  # Workload type — choose a standard workload or define a custom mix.
  #
  # Standard workloads (match original YCSB):
  #   A → 50% read,  50% update                     (heavy update)
  #   B → 95% read,   5% update                     (read mostly)
  #   C → 100% read                                  (read only)
  #   D → 95% read,   5% insert  [uses Latest dist]  (read latest)
  #   E → 95% scan,   5% insert  [variable scan len]  (short ranges)
  #   F → 50% read,  50% read-modify-write            (RMW)
  #   custom → define your own mix below
  type: "A"

  # writeAllFields — controls how many fields are updated per update op.
  #   false → update 1 randomly chosen field per operation (YCSB default)
  #   true  → update ALL fields in the document per operation
  # Set to false to match original YCSB behaviour exactly.
  # Setting to true increases write payload significantly on large documents.
  writeAllFields: false

  # readAllFields — controls which fields are returned per read op.
  #   true  → return the full document (YCSB default)
  #   false → return only "field0" (saves network bandwidth)
  # Set to true to match original YCSB behaviour exactly.
  readAllFields: true

  # custom — only used when type is "custom".
  # Percentages must sum to exactly 100.
  # All six operation types can be combined freely.
  custom:
    read: 50             # FindOne by _id
    insert: 0            # InsertOne with a new key
    update: 50           # UpdateOne by _id (1 field or all fields)
    delete: 0            # DeleteOne by _id
    scan: 0              # Find range by _id with a limit
    readModifyWrite: 0   # FindOne then UpdateOne (2 ops, measured together)

  # scan — controls the length of scan operations.
  # Only relevant for Workload E or custom workloads with scan > 0.
  scan:
    # Minimum number of documents to return per scan.
    # YCSB default: 1
    minLength: 1

    # Maximum number of documents to return per scan.
    # YCSB default: 1000
    # Workload E uses 100 — set this to 100 to match Workload E exactly.
    maxLength: 1000

    # Distribution for scan length selection between minLength and maxLength.
    #   uniform → every length between min and max is equally likely
    #   zipfian → shorter scans are more likely (skewed toward minLength)
    distribution: "uniform"


# ─────────────────────────────────────────────────────────────
# DOCUMENT SHAPE
# Controls the size and structure of documents in the collection.
# ─────────────────────────────────────────────────────────────
documentShape:

  # Number of fields per document (excluding _id).
  # YCSB default: 10
  # Zepto used:   20
  fieldCount: 10

  # Exact byte size of each field value.
  # Every field value is padded or truncated to exactly this many bytes.
  # YCSB default: 100 bytes → ~1KB documents with 10 fields
  # Zepto used:   1000 bytes → ~20KB documents with 20 fields
  # Document size has a major impact on WiredTiger cache utilisation,
  # network throughput, and read/write latency. Match this to the
  # document size of the system you are benchmarking.
  fieldSize: 100

  # nestedDocs — include a nested sub-document in each document.
  # When true, a "nested" field is added containing fieldCount sub-fields.
  # Not part of original YCSB — set to false to match YCSB exactly.
  nestedDocs: false

  # nestedDepth — depth of nesting when nestedDocs is true.
  # Only relevant when nestedDocs is true.
  nestedDepth: 2

  # arrays — include an array field in each document.
  # When true, a "tags" field is added containing arraySize elements.
  # Not part of original YCSB — set to false to match YCSB exactly.
  arrays: false

  # arraySize — number of elements in the array field.
  # Only relevant when arrays is true.
  arraySize: 5

  # useRealisticData — controls what type of data fills field values.
  #   false → random ASCII bytes of exactly fieldSize length (YCSB default)
  #   true  → realistic fake data: names, emails, cities, dates, prices
  #            Values are padded or truncated to exactly fieldSize bytes.
  # Set to false to match original YCSB behaviour exactly.
  # Set to true when you want to benchmark with realistic-looking data.
  useRealisticData: false


# ─────────────────────────────────────────────────────────────
# INDEXES
# Controls which secondary indexes are created after preload.
#
# IMPORTANT: Original YCSB does NOT create any indexes.
# All YCSB queries run against the default _id index only.
# To match original YCSB behaviour exactly, set indexes to an
# empty list:
#   indexes: []
#
# You can add indexes here to benchmark with realistic index
# overhead — e.g. before vs after adding an index.
# Indexes are always created AFTER preload so the Drop() during
# preload does not wipe them.
# ─────────────────────────────────────────────────────────────
indexes: []

# Single field index example:
# indexes:
#   - field: "field0"
#     type: "asc"        # asc | desc | text | geo2dsphere
#     sparse: false      # true = only index documents where field exists
#     unique: false      # true = enforce uniqueness constraint

# Compound index example:
# indexes:
#   - fields:
#       - field: "field0"
#         type: "asc"
#       - field: "field1"
#         type: "desc"
#     sparse: false
#     unique: false


# ─────────────────────────────────────────────────────────────
# EXECUTION
# Controls how the benchmark runs — mode, threads, and key space.
# ─────────────────────────────────────────────────────────────
execution:

  # Execution mode — controls when the benchmark stops.
  #   time   → run for a fixed duration (set duration below)
  #   ops    → run until exactly N operations complete (set operationCount)
  #   rampup → gradually increase threads to find the saturation point
  mode: "time"

  # Duration for time mode — how long to run the benchmark.
  # Accepts Go duration strings: "30s", "5m", "1h", "90s"
  # Only used when mode is "time".
  duration: "5m"

  # Operation count for ops mode — total operations across all threads.
  # Only used when mode is "ops".
  # YCSB equivalent: -p operationcount=10000000
  operationCount: 1000000

  # Number of concurrent goroutines (simulated clients).
  # Each goroutine maintains its own MongoDB connection from the pool.
  # More threads = more concurrency = more throughput until saturation.
  # Rule of thumb: start at 50, increase until throughput plateaus.
  # YCSB equivalent: -threads 512
  threads: 10

  # Target throughput throttle in ops/sec (0 = unlimited).
  # When set, a token-bucket rate limiter caps the total ops/sec across
  # all threads. Useful for controlled comparisons where you want both
  # clusters to receive exactly the same load rate.
  # Example: set to 80% of the slower cluster's peak throughput so both
  # clusters are benchmarked at the same load level.
  targetOpsPerSec: 0

  # ── Key space ──────────────────────────────────────────────
  # These settings mirror the YCSB -p properties for key generation.

  # Key distribution — controls which keys are selected for reads/updates.
  #   uniform    → every key has equal probability (best-case for cache)
  #   zipfian    → ~20% of keys get ~80% of traffic (YCSB default, realistic)
  #   latest     → exponentially biased toward recently inserted keys
  #                (used by Workload D — simulates social feeds, order queues)
  #   sequential → rotates through keys in order (simulates batch processing)
  #
  # IMPORTANT: zipfian is the original YCSB default. Using uniform produces
  # significantly lower latency because the WiredTiger cache hit rate is
  # much higher. Always use zipfian for results comparable to original YCSB.
  keyDistribution: "uniform"

  # Zipfian constant — controls skew (only used when keyDistribution=zipfian).
  # Range: (0, 1) — higher value = more skewed (more traffic to fewer keys).
  # YCSB default: 0.99
  # 0 here means "use the default of 0.99".
  zipfianConstant: 0.99

  # Record count — size of the key space during the benchmark run.
  # Keys are selected from [0, recordCount) during reads and updates.
  # 0 means "use phases.preload.documentCount" — the most common setting.
  # YCSB equivalent: -p recordcount=2000000
  recordCount: 0

  # Key prefix — the string prepended to every key number.
  # YCSB default: "user" → keys are "user0", "user1", "user99999"
  keyPrefix: "user"

  # Key zero-padding — pads key numbers to a fixed width.
  # 0 = no padding (YCSB modern default) → "user0", "user1", "user99999"
  # 12 = padded → "user000000000000", "user000000000001"
  # Padding affects string sort order — without padding, "user9" sorts
  # after "user10000" in MongoDB range scans. Use padding if scan
  # correctness matters.
  # YCSB equivalent: -p zeropadding=12
  keyZeroPadding: 0

  # Insert ordering — controls the order in which new documents are inserted.
  #   ordered → keys inserted sequentially (0, 1, 2, 3, ...)
  #   hashed  → keys inserted in random order (avoids hotspots on sharded clusters)
  # Use "ordered" for replica sets.
  # Use "hashed" when benchmarking sharded clusters to avoid chunk hotspots.
  insertOrdering: "ordered"

  # ── Ramp-up config ─────────────────────────────────────────
  # Only used when mode is "rampup".
  # Gradually increases thread count from initialThreads to maxThreads
  # in steps of stepSize, running each step for stepDuration.
  # Use this to find the concurrency level at which the cluster saturates.
  rampup:
    initialThreads: 1     # starting concurrency
    maxThreads: 100       # maximum concurrency
    stepSize: 10          # threads added per step
    stepDuration: "30s"   # how long each step runs before increasing


# ─────────────────────────────────────────────────────────────
# PHASES
# Controls the preload and warmup phases that run before the
# benchmark measurement begins.
# ─────────────────────────────────────────────────────────────
phases:

  preload:
    # Whether to run the preload phase.
    # When true: drops the collection, inserts documentCount documents,
    # then creates indexes. This ensures a clean, known starting state.
    # When false: benchmark runs against whatever data is already there.
    enabled: true

    # Skip preload if the collection already has documents.
    # When true: checks EstimatedDocumentCount — if > 0, skips the preload.
    # Useful for repeated runs against the same dataset without waiting
    # for a full preload each time.
    # CLI alternative: --skip-preload flag (takes precedence over this setting)
    skipIfExists: false

    # Number of documents to insert during preload.
    # This also sets the key space size unless execution.recordCount is set.
    # YCSB equivalent: -p recordcount=100000
    # Zepto used: 2000000 (producing ~40GB with 20 fields × 1000 bytes)
    documentCount: 100000

    # Number of goroutines used for parallel bulk insertion during preload.
    # More threads = faster preload. Keep below connectionPoolSize.
    # Documents are inserted in batches of 100 per goroutine.
    threads: 20

  warmup:
    # Whether to run a warmup phase before recording metrics.
    # When true: runs the workload for the configured duration but discards
    # all measurements. This heats the WiredTiger cache and JIT paths so
    # the benchmark measures steady-state performance, not cold-start.
    # Strongly recommended for any serious benchmark.
    enabled: true

    # How long to run the warmup.
    # Rule of thumb: long enough for the working set to load into cache.
    # For small datasets (100k docs): 30s is sufficient.
    # For large datasets (2M+ docs): 5m or longer.
    duration: "30s"


# ─────────────────────────────────────────────────────────────
# SCHEDULE
# Controls automatic repeated execution on a CRON schedule.
# Only active when enabled is true.
# ─────────────────────────────────────────────────────────────
schedule:

  # Whether to enable scheduled execution.
  # When false: all schedule settings below are ignored.
  enabled: false

  # Standard 5-field cron expression controlling when each run triggers.
  # Format: "minute hour day-of-month month day-of-week"
  # Examples:
  #   "* * * * *"       → every minute
  #   "*/30 * * * *"    → every 30 minutes
  #   "0 * * * *"       → every hour on the hour
  #   "0 2 * * *"       → every day at 02:00 UTC
  #   "0 */6 * * *"     → every 6 hours
  #   "0 9 * * 1-5"     → every weekday at 09:00 UTC
  cron: "0 2 * * *"

  # Bounds — controls when the scheduler STOPS.
  #
  # Set bounds.type to exactly ONE of the following:
  #
  #   unlimited  → runs forever until manually stopped (Ctrl+C)
  #                no additional fields needed
  #
  #   runFor     → stops after a fixed wall-clock duration from start
  #                set runFor to a Go duration string
  #                example: fires every hour for 8 hours total
  #
  #   maxRuns    → stops after exactly N completed runs
  #                set maxRuns to a positive integer
  #                example: run exactly 10 benchmark cycles
  #
  #   timeWindow → only fires between startAt and stopAt timestamps
  #                triggers before startAt are skipped
  #                scheduler shuts down after stopAt is passed
  #                both startAt and stopAt are required
  #                example: run every hour during a load test window
  #
  # Only populate the fields for the type you choose.
  # Leave all other fields empty or zero to avoid confusion.
  # Dry-run will show the next 5 trigger times and estimated run count.
  bounds:
    type: "unlimited"   # unlimited | runFor | maxRuns | timeWindow

    # Used when type: runFor
    # Total duration the scheduler is active from the moment it starts.
    runFor: ""          # e.g. "600s", "2h", "30m"

    # Used when type: maxRuns
    # Scheduler stops after this many successfully completed runs.
    maxRuns: 0          # e.g. 10

    # Used when type: timeWindow
    # RFC3339 timestamp — triggers before startAt are skipped.
    startAt: ""         # e.g. "2026-05-01T00:00:00Z"
    # RFC3339 timestamp — scheduler shuts down when a trigger fires after stopAt.
    stopAt:  ""         # e.g. "2026-05-07T23:59:59Z"


# ─────────────────────────────────────────────────────────────
# RESULTS
# Controls where benchmark run results are stored.
# Results contain the full RunResult document: all metrics,
# HDR percentiles, delta time-series, system samples, and
# server opcounters.
# ─────────────────────────────────────────────────────────────
results:

  mongodb:
    # Store results in a MongoDB collection.
    # Recommended: use a separate results cluster from the one being
    # benchmarked to avoid the result writes affecting measurements.
    enabled: true

    # Connection string for the results cluster.
    # Can be the same cluster as connection.uri but a different database.
    # REQUIRED when enabled is true.
    uri: "mongodb+srv://user:password@cluster.mongodb.net/"

    # Database in the results cluster where run documents are stored.
    database: "ycsb_results"

    # Collection where run documents are stored.
    # Each run produces one document identified by its run_id (UUID).
    collection: "runs"

  local:
    # Store results as a local JSON file.
    # Written to path/<run_id>.json after every run.
    # Used as a fallback for comparison mode when MongoDB is unavailable.
    enabled: true

    # Directory where JSON result files are written.
    # Created automatically if it does not exist.
    # REQUIRED when enabled is true.
    path: "./results"

  # Tags — free-form string labels attached to every run produced by this config.
  # Tags serve three purposes:
  #
  #   1. Identification: describe what makes this run different from others.
  #      When you look at a result later, tags tell you what config produced it.
  #
  #   2. Comparison: the compare command can find runs by tag.
  #      "go run main.go compare --tag-a baseline --tag-b after-index"
  #      finds the most recent run with each tag and diffs them.
  #
  #   3. Filtering: query your results collection in MongoDB by tag.
  #      db.runs.find({ tags: { $all: ["v8", "zipfian"] } })
  #
  # Good tags describe: version, cluster tier, workload, distribution,
  # write concern, and before/after state.
  # Examples: "v7", "v8", "m40", "m60", "workload-a", "zipfian",
  #           "majority", "w1", "baseline", "before-index", "after-index"
  tags:
    - "baseline"


# ─────────────────────────────────────────────────────────────
# REPORTING
# Controls which report formats are generated after each run.
# Reports are generated from the same RunResult data as results —
# enabling or disabling a report type does not affect what is stored.
# ─────────────────────────────────────────────────────────────
reporting:

  console:
    # Print a live ticker to the console during the benchmark.
    # The ticker refreshes every refreshIntervalMs and shows:
    # elapsed time, ops/sec, total ops, p50, p99, p9999, error count.
    enabled: true

    # How often the live ticker refreshes in milliseconds.
    # 1000 = refresh every 1 second (recommended for most workloads)
    # 5000 = refresh every 5 seconds (better for high-thread-count runs
    #        where 512 threads produce too much console output at 1s)
    refreshIntervalMs: 1000

  html:
    # Generate a self-contained HTML report with Chart.js charts.
    # The report includes: throughput over time, p99 latency over time,
    # CPU usage, memory usage, and a full operation metrics table.
    # Written to outputPath/<run_id>.html after every run.
    # Open directly in any browser — no server needed.
    enabled: true

    # Directory where HTML reports are written.
    # Created automatically if it does not exist.
    # REQUIRED when enabled is true.
    outputPath: "./reports"

  csv:
    # Generate a CSV file with flat per-operation metrics.
    # One row per operation type, one file per run.
    # Written to outputPath/<run_id>.csv after every run.
    # Useful for importing into Excel or Google Sheets.
    # NOTE: CSV contains summary metrics only — not the full RunResult.
    #       Comparison mode requires JSON or MongoDB, not CSV.
    enabled: true

    # Directory where CSV files are written.
    # Created automatically if it does not exist.
    # REQUIRED when enabled is true.
    outputPath: "./results"

