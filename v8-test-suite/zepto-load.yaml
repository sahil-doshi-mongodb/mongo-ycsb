# =============================================================
# FILE: zepto-load.yaml
# =============================================================
#
# CHANGES TO MAKE BEFORE RUNNING:
# --------------------------------
# 1. connection.uri
#    Replace with the Atlas connection string for the cluster
#    you are loading data into (v7 or v8).
#    Do one first, then the other. 
#    Example format:
#    mongodb://user:password@shard-00-00.xxxxx.mongodb.net:27017,
#              shard-00-01.xxxxx.mongodb.net:27017,
#              shard-00-02.xxxxx.mongodb.net:27017
#              /ycsb?ssl=true&authSource=admin
#
# 2. results.mongodb.uri
#    Replace with the connection string of the cluster where
#    you want benchmark results stored. This should be a
#    SEPARATE cluster — not the cluster being benchmarked.
#
# 3. tags
#    Add the cluster version tag before running:
#    - "v7" if loading into the v7 cluster
#    - "v8" if loading into the v8 cluster
#
# VALIDATION COMMAND (run this first — touches nothing):
# -------------------------------------------------------
#   go run main.go dry-run --config configs/zepto-load.yaml
#
# RUN COMMAND:
# ------------
#   go run main.go run --config configs/zepto-load.yaml
#
# WHAT IT DOES:
# -------------
#   Preloads exactly 2,000,000 documents into the target cluster.
#   Each document has 20 fields, each field is 1,000 bytes (~20KB/doc).
#   Total dataset size: ~40GB.
#   Run this ONCE per cluster BEFORE running any workload files.
#   Do NOT run workload files until this completes successfully.
#   Expected duration: 30-60 minutes.
# =============================================================

connection:
  uri: ""
  database: "ycsb"
  collection: "usertable"
  readPreference: "primary"
  readConcern: "local"
  writeConcern: "majority"
  connectionPoolSize: 1000
  timeoutMs: 60000

workload:
  type: "A"
  writeAllFields: false
  readAllFields: true
  scan:
    minLength: 1
    maxLength: 1000
    distribution: "uniform"

documentShape:
  fieldCount: 20
  fieldSize: 1000
  nestedDocs: false
  arrays: false
  useRealisticData: false

indexes: []

execution:
  mode: "ops"
  operationCount: 2000000
  threads: 512
  targetOpsPerSec: 0
  keyDistribution: "uniform"
  zipfianConstant: 0.99
  recordCount: 2000000
  keyPrefix: "user"
  keyZeroPadding: 0
  insertOrdering: "ordered"

phases:
  preload:
    enabled: true
    skipIfExists: false
    documentCount: 2000000
    threads: 512
  warmup:
    enabled: false

schedule:
  enabled: false
  cron: ""
  bounds:
    type: "unlimited"
    runFor: ""
    maxRuns: 0
    startAt: ""
    stopAt: ""

results:
  mongodb:
    enabled: true
    uri: ""
    database: "ycsb_results"
    collection: "zepto_runs"
  local:
    enabled: true
    path: "./results/zepto"
  tags:
    - "zepto"
    - "load"
    - "v8"

reporting:
  console:
    enabled: true
    refreshIntervalMs: 5000
  html:
    enabled: true
    outputPath: "./reports/zepto"
  csv:
    enabled: true
    outputPath: "./results/zepto"
